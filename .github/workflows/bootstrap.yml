name: Bootstrap (State-Bucket)

# Einmalig manuell starten: legt den Object-Storage-Bucket für den Terraform-State an.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
  SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
  SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
  SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/bootstrap
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Existiert der Bucket schon?
        id: check
        run: |
          if aws s3api head-bucket --bucket ncg-it-openwebui-tfstate \
               --endpoint-url https://s3.nl-ams.scw.cloud --region nl-ams 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Bucket existiert bereits – nichts zu tun."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.exists == 'false'
        run: |
          for i in 1 2 3 4; do terraform init -input=false && break; [ $i = 4 ] && exit 1; sleep 15; done
          terraform apply -input=false -auto-approve
