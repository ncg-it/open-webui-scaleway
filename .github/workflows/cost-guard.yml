name: Cost guard

# Checks the Scaleway costs of the current month every 6 hours.
# Once COST_LIMIT_EUR (repo variable, excl. VAT) is reached, the instance is powered off and the run fails
# -> GitHub sends an email. To power it back on: run manually with action=start.
on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "check = check costs, start = power the instance back on"
        type: choice
        options: [check, start]
        default: check

permissions:
  contents: read

concurrency:
  group: cost-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    if: vars.SERVER_ID != ''
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/cost-guard.sh
        env:
          ACTION: ${{ inputs.action || 'check' }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SERVER_ID: ${{ vars.SERVER_ID }}
          ZONE: nl-ams-1
          COST_LIMIT_EUR: ${{ vars.COST_LIMIT_EUR || '30' }}
          WARN_PERCENT: "80"
