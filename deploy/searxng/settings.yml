# SearXNG - private metasearch engine used only by Open WebUI (not publicly reachable).
# Extends the SearXNG default settings; secret_key comes from SEARXNG_SECRET.
use_default_settings: true

general:
  instance_name: "ncg-search"

server:
  limiter: false        # internal access from Open WebUI only
  image_proxy: false
  public_instance: false

search:
  safe_search: 0
  default_lang: "auto"
  formats:
    - html
    - json              # required by Open WebUI

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
