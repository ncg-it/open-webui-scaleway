name: open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.5
    restart: unless-stopped
    depends_on:
      - searxng
    expose:
      - "8080"
    volumes:
      - /mnt/data/open-webui:/app/backend/data
    environment:
      WEBUI_URL: https://${DOMAIN}
      # App name in the browser tab, login page and sidebar.
      # Open WebUI appends " (Open WebUI)" to custom names unless an enterprise license is installed.
      WEBUI_NAME: ${WEBUI_NAME:-NCG IT Consulting Chat}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY is missing}

      # Single-user setup: set ENABLE_SIGNUP=false after the admin account has been created
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      DEFAULT_USER_ROLE: pending

      # LLMs via Scaleway Generative APIs (OpenAI-compatible)
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: ${SCW_GENAI_BASE_URL:-https://api.scaleway.ai/v1}
      OPENAI_API_KEY: ${SCW_GENAI_API_KEY:?SCW_GENAI_API_KEY is missing}

      # Document embeddings (RAG) via Scaleway as well - no local model needed
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: ${SCW_GENAI_BASE_URL:-https://api.scaleway.ai/v1}
      RAG_OPENAI_API_KEY: ${SCW_GENAI_API_KEY}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-bge-multilingual-gemma2}

      # Default model and web search via the private SearXNG instance.
      # Note: these values only apply to a fresh install - afterwards the
      # admin panel settings (stored in the database) take precedence.
      DEFAULT_MODELS: ${DEFAULT_MODELS:-mistral-medium-3.5-128b}
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
      WEB_SEARCH_RESULT_COUNT: "5"

      # Speech-to-text via Scaleway Whisper (URL and key same as OPENAI_API_*)
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_MODEL: whisper-large-v3

      # Security
      CORS_ALLOW_ORIGIN: https://${DOMAIN}
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_SESSION_COOKIE_SAME_SITE: strict
      WEBUI_AUTH_COOKIE_SECURE: "true"
      WEBUI_AUTH_COOKIE_SAME_SITE: strict
      # Only apply to a fresh install (afterwards: database / admin panel):
      ENABLE_MFA: "true"
      JWT_EXPIRES_IN: 7d
      ENABLE_COMMUNITY_SHARING: "false"
      SHOW_ADMIN_DETAILS: "false"

      # No telemetry
      ANONYMIZED_TELEMETRY: "false"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"

  searxng:
    image: searxng/searxng:2026.10.30-ffa88e3ba
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is missing}
      SEARXNG_BASE_URL: http://searxng:8080/
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./searxng:/etc/searxng:ro

  # Open Terminal: sandboxed Linux shell, file browser and terminal panel for the chat.
  # Only reachable from Open WebUI on the internal network (no published port).
  # Connect it in Admin -> Settings -> Integrations -> Open Terminal: http://open-terminal:8000
  open-terminal:
    image: ghcr.io/open-webui/open-terminal:0.17.5-slim
    restart: unless-stopped
    # Start shells and the file browser in the home directory instead of the app code in /app
    working_dir: /home/user
    expose:
      - "8000"
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:?OPEN_TERMINAL_API_KEY is missing}
    volumes:
      # Home directory on the data volume: persists across updates, included in snapshots
      - /mnt/data/open-terminal:/home/user
    mem_limit: 2g
    pids_limit: 512

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      - open-webui
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/data/caddy/data:/data
      - /mnt/data/caddy/config:/config
