name: open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.5
    restart: unless-stopped
    depends_on:
      - searxng
    expose:
      - "8080"
    volumes:
      - /mnt/data/open-webui:/app/backend/data
    environment:
      WEBUI_URL: https://${DOMAIN}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY fehlt}

      # Nur du als Nutzer: nach dem Anlegen des Admin-Accounts ENABLE_SIGNUP=false setzen
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      DEFAULT_USER_ROLE: pending

      # LLMs über Scaleway Generative APIs (OpenAI-kompatibel)
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: ${SCW_GENAI_BASE_URL:-https://api.scaleway.ai/v1}
      OPENAI_API_KEY: ${SCW_GENAI_API_KEY:?SCW_GENAI_API_KEY fehlt}

      # Embeddings für Dokumente (RAG) ebenfalls über Scaleway – kein lokales Modell nötig
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: ${SCW_GENAI_BASE_URL:-https://api.scaleway.ai/v1}
      RAG_OPENAI_API_KEY: ${SCW_GENAI_API_KEY}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-bge-multilingual-gemma2}

      # Standardmodell und Websuche über die eigene SearXNG-Instanz.
      # Hinweis: Diese Werte gelten nur bei einer Neuinstallation – danach zählen die
      # Einstellungen im Admin-Panel (in der Datenbank gespeichert).
      DEFAULT_MODELS: ${DEFAULT_MODELS:-mistral-medium-3.5-128b}
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
      WEB_SEARCH_RESULT_COUNT: "5"

      # Sicherheit
      CORS_ALLOW_ORIGIN: https://${DOMAIN}
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_SESSION_COOKIE_SAME_SITE: strict
      WEBUI_AUTH_COOKIE_SECURE: "true"
      WEBUI_AUTH_COOKIE_SAME_SITE: strict
      # Gelten nur bei Neuinstallation (danach Datenbank/Admin-Panel):
      ENABLE_MFA: "true"
      JWT_EXPIRES_IN: 7d
      ENABLE_COMMUNITY_SHARING: "false"
      SHOW_ADMIN_DETAILS: "false"

      # Keine Telemetrie
      ANONYMIZED_TELEMETRY: "false"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"

  searxng:
    image: searxng/searxng:2026.10.30-ffa88e3ba
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET fehlt}
      SEARXNG_BASE_URL: http://searxng:8080/
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./searxng:/etc/searxng:ro

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      - open-webui
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/data/caddy/data:/data
      - /mnt/data/caddy/config:/config
